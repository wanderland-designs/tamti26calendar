name: Sync Kronox Schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"    # ~05:00 UTC
    - cron: "0 17 * * *"   # ~17:00 UTC

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sync
        env:
          KRONOX_URL: ${{ secrets.KRONOX_URL }}
          KRONOX_URL_2: ${{ secrets.KRONOX_URL_2 }}
          KRONOX_URL_3: ${{ secrets.KRONOX_URL_3 }}
        run: python update_schedule.py

      - name: Commit updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*.ics
          git diff --cached --quiet || git commit -m "Update schedule feeds"
          git push
