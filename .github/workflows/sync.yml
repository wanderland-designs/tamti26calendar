name: Sync Kronox Schedule

on:
  schedule:
    # Every 4 hours. Adjust as you like (cron is UTC).
    - cron: "0 */4 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sync script
        env:
          KRONOX_URL: ${{ secrets.KRONOX_URL }}
        run: python update_schedule.py

      - name: Commit updated schedule if changed
        run: |
          git config user.name "schedule-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/schema_clean.ics
          git diff --staged --quiet || git commit -m "Update schedule $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
